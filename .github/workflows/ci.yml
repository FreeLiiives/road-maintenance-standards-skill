name: Tests
on:
  push:
    paths-ignore:
      - 'skills/road-maintenance-standards/reports/**'
      - 'skills/road-maintenance-standards/data/observations.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/road-maintenance-standards/scripts/standards.py search Pothole --json
